[project]
name = "vesper-pool-protocol"
version = "0.1.0"
description = "Low-volatility Vyper AMM protocol review target"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "titanoboa>=0.2.8",
  "vyper>=0.4.3,<0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
