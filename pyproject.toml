[project]
name = "vesper-pool-protocol"
version = "2.0.0"
description = "Two-asset Vyper AMM with reserve accounting and peg stress observability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "titanoboa==0.2.8",
  "vyper==0.4.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
