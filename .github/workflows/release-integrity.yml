name: Release integrity

on:
  push:
    branches: [production]
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare published refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main production --tags
          main=$(git rev-parse origin/main)
          production=$(git rev-parse origin/production)
          test "$main" = "$production"
          if [[ "$GITHUB_REF_TYPE" == "tag" || "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag=$(git rev-parse 'v2.0.0^{}')
            test "$main" = "$tag"
          fi
          python -c 'import tomllib; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == "2.0.0"'
